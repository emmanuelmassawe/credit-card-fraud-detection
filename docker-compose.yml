version: '3.8'

services:
  # FastAPI + Frontend Application
  fraud-detection-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-app
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - ./reports:/app/reports
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge