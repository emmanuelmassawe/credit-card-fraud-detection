apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-service
  namespace: fraud-detection
  labels:
    app: fraud-detection
spec:
  type: ClusterIP
  selector:
    app: fraud-detection
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
    name: http

---
apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-loadbalancer
  namespace: fraud-detection
  labels:
    app: fraud-detection
spec:
  type: LoadBalancer
  selector:
    app: fraud-detection
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http