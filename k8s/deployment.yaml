apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection-app
  namespace: fraud-detection
  labels:
    app: fraud-detection
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fraud-detection
  template:
    metadata:
      labels:
        app: fraud-detection
        version: v1
    spec:
      containers:
      - name: fraud-detection
        image: fraud-detection-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        
        env:
        - name: PYTHONUNBUFFERED
          valueFrom:
            configMapKeyRef:
              name: fraud-detection-config
              key: PYTHONUNBUFFERED
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: fraud-detection-config
              key: LOG_LEVEL
        - name: DAGSHUB_USERNAME
          valueFrom:
            secretKeyRef:
              name: fraud-detection-secrets
              key: DAGSHUB_USERNAME
        - name: DAGSHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: fraud-detection-secrets
              key: DAGSHUB_TOKEN
        
        volumeMounts:
        - name: models-volume
          mountPath: /app/models
        - name: data-volume
          mountPath: /app/data
        
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      
      volumes:
      - name: models-volume
        persistentVolumeClaim:
          claimName: fraud-detection-models
      - name: data-volume
        persistentVolumeClaim:
          claimName: fraud-detection-data